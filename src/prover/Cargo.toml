[package]
name = "prover"
version = "0.1.0"
edition = "2024"

[dependencies]
# Ethereum/Web3
ethers = { version = "2.0", features = ["abigen", "ws", "rustls"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"

# Database and Cryptography  
rocksdb = "0.21"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
poseidon-rs = "0.0.10"
ff_ce = "0.11"
chrono = { version = "0.4", features = ["serde"] }

# For custom 254-bit SMT
hashbrown = "0.14"
rand = "0.8"
num = "0.4"

# ZK-SNARK Proof Generation
# Using simpler approach with command-line snarkjs for now
# wasmer = "4.0"
# wasmer-wasi = "4.0"
# circom-rs = "0.1"
# ark-bn254 = "0.4"
# ark-groth16 = "0.4"
# ark-std = "0.4"
# ark-serialize = "0.4"
# ark-ff = "0.4"
# ark-ec = "0.4"

[build-dependencies]
ethers = "2.0"
